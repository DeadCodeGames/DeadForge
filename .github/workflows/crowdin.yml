name: Crowdin Action

on:
  push:
    branches: 
      - 2024/2025
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 2024/2025
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  synchronize-with-crowdin:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.actor != 'deadcodebot'
    outputs:
      BRANCH_EXISTS: ${{ steps.pr_branch_make.outputs.BRANCH_EXISTS }}
      SHOULD_SKIP: ${{ steps.run_crowdin.outputs.SHOULD_SKIP }}
      TARGET_BRANCH: ${{ steps.get_target_branch.outputs.TARGET_BRANCH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed to work with branches

      - name: Detect base branch
        id: get_target_branch
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "TARGET_BRANCH=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
          else
            echo "TARGET_BRANCH=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Get Crowdin CLI version
        id: crowdin_version
        run: echo "CROWDIN_VERSION=$(npm view @crowdin/cli version)" >> $GITHUB_OUTPUT
      
      - name: Restore npm cache (Crowdin CLI)
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-crowdin-cli-${{ steps.crowdin_version.outputs.CROWDIN_VERSION }}

      - name: Run Crowdin and handle no translation case
        id: run_crowdin
        run: |
          set +e
          npx @crowdin/cli upload sources --config .crowdin.yml
          OUTPUT=$(npx @crowdin/cli download --config .crowdin.yml --skip-untranslated-strings)
          result=$?
          if echo $OUTPUT | grep -q "Couldn't find any file to download"; then
            echo "No translations downloaded. Skipping i18n update."
            echo "SHOULD_SKIP=true" >> $GITHUB_OUTPUT
          else
            echo "SHOULD_SKIP=false" >> $GITHUB_OUTPUT
          fi
          exit $result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          
      - name: Save npm cache (Crowdin CLI)
        uses: actions/cache/save@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-crowdin-cli-${{ steps.crowdin_version.outputs.CROWDIN_VERSION }}
      
      - name: Update i18n.ts
        run: node .github/workflows/l10ncheck.js

      - name: Get Octokit and Actions Core versions
        id: helpers_version
        run: |
          OCTOKIT_VERSION=$(npm view @octokit/rest version)
          ACTIONS_CORE_VERSION=$(npm view @actions/core version)
          echo "HELPERS_VERSION=${OCTOKIT_VERSION},${ACTIONS_CORE_VERSION}" >> $GITHUB_OUTPUT

      - name: Restore octokit deps
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-octokit-${{ steps.helpers_version.outputs.HELPERS_VERSION }}

      - name: Sync Crowdin translations
        run: |
          npm i --no-save --force @octokit/rest @actions/core
          node .github/workflows/commitl10nchanges.js
        env:
          DEADCODEBOT_PAT: ${{ secrets.DEADCODEBOT_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: sync-translations

      - name: Save npm cache (Helpers)
        uses: actions/cache/save@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-octokit-${{ steps.crowdin_version.outputs.HELPERS_VERSION }}

      - name: Create PR (if not exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_exists=$(gh pr list --head l10n_crowdin_translations --json number -q '.[0].number')
          if [ -z "$pr_exists" ]; then
            gh pr create \
              --title "Update translations via Crowdin" \
              --body "Automated PR with updated translations from Crowdin." \
              --base "${{ steps.get_target_branch.outputs.TARGET_BRANCH }}" \
              --head l10n_crowdin_translations \
              --draft
          else
            echo "PR already exists (#$pr_exists)"
          fi
            echo "BRANCH_EXISTS=true" >> $GITHUB_OUTPUT
